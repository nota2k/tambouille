<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <!--
      Ni `maximum-scale` ni `user-scalable=no` : ils empêchent le zoom, dont
      dépendent les personnes malvoyantes pour lire la page. Ce qu'ils
      évitaient — le zoom involontaire de Safari sur un champ de moins de 16px —
      se règle du côté de la taille du texte, pas en confisquant le geste.
    -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FE2370">
  <link rel="icon" href="/favicon.ico">

  <!--
      Les polices sont servies par le site lui-même (`public/fonts/`), et non
      plus par Google. Ce qui bloquait le rendu n'était pas leur poids — la
      feuille de Google fait un kilo-octet — mais l'ouverture de deux origines
      tierces avant même de savoir quels fichiers demander : 246 ms de rendu
      bloqué que deux `preconnect` amortissaient au lieu de les supprimer.

      Préchargées, donc : leur nom est fixe (Vite n'appose pas d'empreinte à ce
      qui vient de `public/`), le navigateur les découvre à la première ligne du
      document au lieu de les attendre derrière la feuille de style, et le texte
      s'affiche directement dans la bonne fonte. Sans cela il est peint deux
      fois, et les trois repeints valaient 0,0036 de décalage cumulé.

      Quatre fichiers et pas huit : les sous-ensembles `latin-ext` et les
      graisses grasses sont laissés à la découverte normale, ils ne servent
      qu'à une partie du texte. `crossorigin` reste obligatoire même en même
      origine — les polices sont chargées en mode CORS, et sans lui le fichier
      préchargé serait redemandé.
    -->
  <link rel="preload" href="/fonts/Gulax-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/rambla-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/rambla-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/arvo-400-latin.woff2" as="font" type="font/woff2" crossorigin>
