<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <!--
      Ni `maximum-scale` ni `user-scalable=no` : ils empêchent le zoom, dont
      dépendent les personnes malvoyantes pour lire la page. Ce qu'ils
      évitaient — le zoom involontaire de Safari sur un champ de moins de 16px —
      se règle du côté de la taille du texte, pas en confisquant le geste.
    -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FE2370">
  <link rel="icon" href="/favicon.ico">

  <!--
      Les polices sont demandées ici et non plus par un `@import` dans le CSS.
      Depuis la feuille, le navigateur ne découvrait la requête qu'après l'avoir
      téléchargée et analysée : trois allers-retours en file indienne — HTML,
      CSS du site, CSS de Google, fichiers de police — soit près d'une seconde
      avant que le premier caractère ne s'affiche dans la bonne fonte. Déclarées
      dans le document, elles partent avec lui.

      `preconnect` ouvre la connexion à `fonts.gstatic.com` avant même de savoir
      quel fichier demander : la feuille de Google ne le dira qu'une fois lue,
      et la poignée de main TLS aurait alors lieu en pure perte de temps.
      `crossorigin` n'est pas décoratif — les polices sont chargées en mode CORS,
      et sans lui la connexion préchauffée ne serait pas celle réutilisée.
    -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Rambla:wght@400;700&display=swap">

  <!-- Les pochettes viennent toutes de là, et la plus grande d'entre elles est
       l'image qui décide du Largest Contentful Paint. L'URL suit celle du
       bucket, Vite substituant la variable au build. -->
  <link rel="preconnect" href="%VITE_R2_PUBLIC_URL%">

  <!--
      Les valeurs par défaut du site. Les vues les remplacent au montage via
      `useSeo`, mais elles restent ce que voit tout lecteur qui n'exécute pas
      le JavaScript — au premier rang desquels les robots d'aperçu de partage
      (Facebook, Discord, WhatsApp, Slack).
    -->
  <meta name="description"
    content="Tambouille, le site de partage et d’écoute de mixs : découvrez les mix des membres, écoutez en streaming et suivez vos artistes.">
  <meta property="og:site_name" content="Tambouille">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tambouille">
  <meta property="og:description"
    content="Tambouille, le site de partage et d’écoute de mixs : découvrez les mix des membres, écoutez en streaming et suivez vos artistes.">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary">

    content="Tambouille, le site de partage et d’écoute de mixs : découvrez les mix des membres, écoutez en streaming et suivez vos artistes.">
  <title>Tambouille</title>
