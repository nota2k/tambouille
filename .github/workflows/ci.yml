name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Le déploiement ne part que sur commande, le temps qu'on lui fasse confiance.
  # Le passage à `push` sur `main` est la dernière tâche du chantier, pas la
  # première — voir openspec/changes/add-o2switch-deploy/tasks.md, groupe 6.
  #
  # `ref` est aussi le retour arrière : redéployer une version connue-bonne en
  # la désignant, sans révoquer de commit ni réécrire l'historique.
  workflow_dispatch:
    inputs:
      ref:
        description: "Référence à déployer (défaut : la branche courante)"
        required: false
        type: string
      # Exercer le transfert sans rien écrire : rclone liste la destination et
      # simule la synchronisation, les étapes qui modifient le serveur sont
      # sautées. C'est ce qui permet de voir ce qu'un déploiement effacerait
      # AVANT de lui faire confiance, et de valider l'accès sans risque.
      dry_run:
        description: "Ne rien écrire : lister et simuler le transfert"
        required: false
        default: false
        type: boolean

# Une nouvelle poussée sur une proposition de fusion annule l'exécution en cours
# pour cette même référence : seul le dernier état compte. Les exécutions sur
# `main` ne sont jamais annulées — chacune correspond à un commit distinct de
# l'historique, et en perdre une laisserait un trou.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Aucune tâche de vérification ne lit de secret, et c'est délibéré : elles
# restent ainsi exécutables telles quelles sur une proposition venue d'un fork.
# La tâche `deploy`, elle, en lit — mais elle ne s'exécute jamais sur une
# `pull_request`, donc la propriété est préservée telle qu'elle est spécifiée.
permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 22 : la seule version qui satisfasse à la fois le `engines` du
      # frontend et la production, qui tourne sur le node 22 du nodevenv
      # o2switch. Vérifier sur une version que le serveur n'exécute pas
      # reviendrait à vérifier autre chose que ce qui est déployé.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` et non `npm install` : il échoue si le verrou et le manifeste
      # divergent, ce qui est précisément le signal recherché.
      #
      # Le `postinstall` du paquet déclenche `prisma generate`. Vérifié : il
      # fonctionne sans `DATABASE_URL`, donc aucune variable n'est nécessaire ici.
      - run: npm ci
        working-directory: backend

      - run: npm run format:check
        working-directory: backend

      # Aucune variable d'environnement, aucun service. Vérifié avant d'écrire
      # ce fichier : la suite passe 539/539 dans un environnement entièrement
      # vierge et sans base joignable.
      - run: npm test
        working-directory: backend

      - run: npm run build
        working-directory: backend

      # Non bloquant. Le dépôt compte 659 problèmes eslint côté backend, dont
      # environ 294 ne sont pas auto-corrigeables : les rendre bloquants
      # reviendrait à exiger une remise à plat de cette taille avant toute
      # fusion. Le rapport reste lisible dans les journaux, et son nettoyage
      # est une entrée distincte de TODOS.md.
      - name: eslint (rapport, non bloquant)
        run: npm run lint:check
        working-directory: backend
        continue-on-error: true

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run format:check
        working-directory: frontend

      # `build` enchaîne `vue-tsc --build` et `vite build` par `run-p`, donc le
      # contrôle de typage est couvert sans étape séparée.
      - run: npm run build
        working-directory: frontend

      - name: eslint et oxlint (rapport, non bloquant)
        run: npm run lint:check
        working-directory: frontend
        continue-on-error: true

  e2e:
    name: e2e
    runs-on: ubuntu-latest

    # `mail-boot.e2e-spec.ts` épingle une garantie qu'aucun test unitaire ne
    # couvre : aucun défaut de configuration SMTP n'empêche l'API de démarrer.
    # Elle exige un PostgreSQL joignable, parce que `PrismaService.onModuleInit`
    # appelle `$connect()`.
    #
    # Un service déclaré ici, créé et détruit avec la tâche, n'est pas une
    # dépendance extérieure : il ne tient à aucun secret ni à aucune machine
    # tierce, et il est reproductible d'une exécution à l'autre.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tambouille
          POSTGRES_PASSWORD: tambouille
          POSTGRES_DB: tambouille
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tambouille"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      # AUCUNE étape de migration, et ce n'est pas un oubli : vérifié contre une
      # base vide et non migrée, la suite passe. `onModuleInit` se contente d'un
      # `$connect()`, sans requête. Ajouter `prisma migrate deploy` ici ferait
      # dépendre la vérification d'un état de schéma dont elle n'a pas besoin.
      - run: npm run test:e2e
        working-directory: backend
        env:
          DATABASE_URL: postgresql://tambouille:tambouille@localhost:5432/tambouille?schema=public

  # ─────────────────────────────────────────────────────────────────────────
  # Déploiement vers o2switch.
  #
  # `needs` sur les trois vérifications : déployer sans qu'elles soient vertes
  # est impossible, et c'est une propriété du graphe des tâches, pas une
  # consigne. La condition `workflow_dispatch` garantit qu'aucune
  # `pull_request` ne peut atteindre cette tâche, donc les secrets ci-dessous ne
  # sont jamais exposés à du code venu d'un fork.
  #
  # TRANSPORT : FTPS, et non SSH. Le port 22 est filtré par le pare-feu du
  # mutualisé, dont la liste blanche compte cinq emplacements quand les plages
  # de sortie des runners GitHub se comptent en milliers de blocs CIDR. Ce n'est
  # pas une adresse à trouver, c'est une impossibilité de structure — mesurée le
  # 17 août 2026. Le port 21 répond.
  #
  # Le FTP transfère des fichiers et n'exécute rien. Migrations, installation et
  # redémarrage sont donc délégués à un cron du serveur : ce workflow dépose une
  # demande et attend le résultat. Voir deploy/o2switch-cron.sh.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: deploy
    needs: [backend, frontend, e2e]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Un déploiement qui pend est pire qu'un déploiement qui échoue : il ne dit
    # rien et consomme. Le 17 août, un transfert bloqué sur une connexion filtrée
    # a tourné jusqu'à l'annulation manuelle.
    timeout-minutes: 30
    # Deux déploiements ne se chevauchent jamais, et aucun n'est annulé en cours
    # de route : interrompre un transfert laisserait le serveur mi-ancien
    # mi-neuf, ce qu'aucune étape ultérieure ne rattraperait.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      # Le compte FTP est cantonné à ~/tambouille : sa racine EST le répertoire
      # de l'application. Les chemins ci-dessous sont donc relatifs à elle, et
      # aucun d'eux ne peut désigner quoi que ce soit hors du cantonnement.
      RCLONE_CONFIG_O2_TYPE: ftp
      # Le NOM, jamais l'adresse IP : en FTPS explicite rclone valide le
      # certificat du serveur contre le nom employé pour se connecter. Par l'IP,
      # la validation échouerait, et le seul contournement serait de la
      # désactiver — soit garder le chiffrement en perdant l'authentification du
      # serveur, ce qui laisse la porte ouverte à un intermédiaire.
      RCLONE_CONFIG_O2_HOST: ${{ secrets.O2SWITCH_FTP_HOST }}
      RCLONE_CONFIG_O2_USER: ${{ secrets.O2SWITCH_FTP_USER }}
      # AUTH TLS sur le port 21. Jamais de FTP nu : sans TLS le mot de passe et
      # l'intégralité des fichiers traverseraient internet en clair à chaque
      # livraison. Le 990 (TLS implicite) est filtré, mesuré le 17 août.
      RCLONE_CONFIG_O2_EXPLICIT_TLS: "true"
      # Ne jamais demander de mot de passe : sur un runner, une invite attend une
      # saisie qui ne viendra jamais et la tâche pend au lieu d'échouer.
      RCLONE_CONFIG_O2_ASK_PASSWORD: "false"
      RCLONE_CONTIMEOUT: 15s
      RCLONE_TIMEOUT: 60s
      RCLONE_LOW_LEVEL_RETRIES: "2"

    steps:
      - uses: actions/checkout@v7
        with:
          # Vide sur un déclenchement ordinaire : actions/checkout retombe alors
          # sur la référence courante.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # apt-get plutôt qu'une action tierce : ce workflow porte les identifiants
      # FTP de production, et une action épinglée sur un tag mobile pourrait les
      # lire. Voir design.md, Decisions.
      - name: Installer rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      # rclone n'accepte pas un mot de passe en clair dans sa configuration : il
      # le veut obscurci. L'obscurcissement est RÉVERSIBLE — ce n'est pas du
      # chiffrement — d'où le masquage explicite du résultat dans les journaux.
      - name: Configurer l'accès FTPS
        # Le secret passe par l'ENVIRONNEMENT, jamais par interpolation dans le
        # script. GitHub substitue `${{ }}` littéralement dans le texte du shell :
        # un mot de passe contenant un guillemet, une barre oblique inverse, un
        # `$` ou un accent grave serait mangé par le shell avant d'atteindre
        # rclone — et c'est ce qui a produit trois `530 Login authentication
        # failed` alors que les mêmes identifiants fonctionnaient en local.
        #
        # La même précaution vaut contre l'injection : un secret interpolé dans
        # un script est du code, pas une donnée.
        env:
          FTP_PASS: ${{ secrets.O2SWITCH_FTP_PASS }}
        run: |
          set -euo pipefail
          OBSCURED=$(rclone obscure "$FTP_PASS")
          # L'obscurcissement est RÉVERSIBLE — ce n'est pas du chiffrement — donc
          # le résultat est aussi sensible que le mot de passe lui-même.
          echo "::add-mask::$OBSCURED"
          echo "RCLONE_CONFIG_O2_PASS=$OBSCURED" >> "$GITHUB_ENV"

      # Exercer l'accès avant d'en dépendre. Cette étape échoue en quelques
      # secondes là où le transfert, lui, pendait — c'est ce qui est arrivé au
      # premier essai, avant qu'on sache le port 22 filtré.
      # DIAGNOSTIC TEMPORAIRE — à retirer une fois la cause du 530 établie.
      #
      # Le même curl réussit depuis un poste de développement et échoue peut-être
      # ici : cette étape sépare « rclone est mal configuré » de « les
      # identifiants ou l'adresse du runner sont refusés ». Deux hypothèses ont
      # déjà été démenties, on mesure au lieu de supposer.
      - name: Diagnostic — curl depuis le runner
        continue-on-error: true
        env:
          FTP_USER: ${{ secrets.O2SWITCH_FTP_USER }}
          FTP_PASS: ${{ secrets.O2SWITCH_FTP_PASS }}
          FTP_HOST: ${{ secrets.O2SWITCH_FTP_HOST }}
        run: |
          echo "longueur du nom : ${#FTP_USER}   longueur du mot de passe : ${#FTP_PASS}"
          echo "--- curl FTPS explicite ---"
          curl -sS --ssl-reqd --list-only -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1 | head -20
          echo "code curl = $?"

      - name: Vérifier l'accès FTPS
        run: |
          set -euo pipefail
          echo "Racine du compte FTP :"
          rclone lsd o2: --max-depth 1 -vv 2>&1 | tail -25

      - name: Construire le backend
        working-directory: backend
        run: npm ci && npm run build

      - name: Construire le frontend
        working-directory: frontend
        run: npm ci && npm run build

      # ── Transfert ────────────────────────────────────────────────────────
      #
      # `sync` (miroir, supprime les fichiers surnuméraires) par SOUS-RÉPERTOIRE,
      # jamais sur `backend/` lui-même. `.env`, `node_modules/`, `tmp/`,
      # `.htaccess` et les 222 Mo d'`uploads/` vivent à la racine de `backend/` :
      # ils sont hors de portée par construction.
      #
      # `--max-delete` est la seconde protection, indépendante de la première :
      # elle tient même si quelqu'un réécrit un chemin de travers. Un échec sur
      # cette garde se LIT, il ne se relève pas par réflexe.
      - name: Transférer les artefacts
        run: |
          set -euo pipefail
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
            echo "── MODE SIMULATION : rien ne sera écrit ──"
            rclone lsd o2:backend || true
          fi
          rclone sync backend/dist/      o2:backend/dist/      --max-delete=50 $DRY --stats-one-line
          rclone sync backend/generated/ o2:backend/generated/ --max-delete=50 $DRY --stats-one-line
          rclone sync backend/prisma/    o2:backend/prisma/    --max-delete=20 $DRY --stats-one-line
          rclone sync frontend/dist/     o2:frontend/dist/     --max-delete=80 $DRY --stats-one-line
          rclone copy backend/package.json      o2:backend/ $DRY
          rclone copy backend/package-lock.json o2:backend/ $DRY

      # ── Demande, puis attente ────────────────────────────────────────────
      #
      # Le FTP n'exécute rien. Le pipeline dépose une DEMANDE portant son SHA ;
      # le script du serveur — qui vit dans ~/bin/, hors de portée de ce compte
      # FTP — l'exécute et écrit un résultat.
      #
      # Le SHA circule dans les deux sens pour que le pipeline ne puisse pas lire
      # le résultat d'un déploiement antérieur et le prendre pour le sien.
      - name: Demander l'exécution au serveur
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "${{ github.sha }}" > pending
          rclone copyto pending o2:deploy/pending
          echo "demande déposée pour ${{ github.sha }}"

      # Un déploiement qui dépose une demande et se déclare réussi n'annonce que
      # son propre envoi. Le résultat qui compte est celui de l'opération.
      - name: Attendre le résultat du serveur
        if: ${{ !inputs.dry_run }}
        timeout-minutes: 15
        run: |
          set -uo pipefail
          SHA="${{ github.sha }}"
          for i in $(seq 1 45); do
            if rclone cat o2:deploy/result > result 2>/dev/null; then
              if grep -q "^sha=$SHA$" result; then
                echo "── résultat du serveur ──"; cat result
                grep -q '^status=ok$' result && exit 0
                echo "::error::le serveur a signalé un échec"; exit 1
              fi
            fi
            sleep 20
          done
          echo "::error::aucun résultat du serveur après 15 minutes — le cron tourne-t-il ?"
          exit 1

      # Constater plutôt que supposer : un redémarrage réussi n'exclut pas que
      # les deux moitiés du site soient désaccordées. C'est arrivé le 17 août.
      - name: Vérifier que le site répond
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS -o /dev/null -w 'API  %{http_code}\n' https://api.tambouille.pantagruweb.club/api/mixes
          curl -fsS -o /dev/null -w 'site %{http_code}\n' https://tambouille.pantagruweb.club/
