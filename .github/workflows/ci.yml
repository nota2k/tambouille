name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Le déploiement ne part que sur commande, le temps qu'on lui fasse confiance.
  # Le passage à `push` sur `main` est la dernière tâche du chantier, pas la
  # première — voir openspec/changes/add-o2switch-deploy/tasks.md, groupe 6.
  #
  # `ref` est aussi le retour arrière : redéployer une version connue-bonne en
  # la désignant, sans révoquer de commit ni réécrire l'historique.
  workflow_dispatch:
    inputs:
      ref:
        description: "Référence à déployer (défaut : la branche courante)"
        required: false
        type: string
      # Exercer le transfert sans rien écrire : rclone liste la destination et
      # simule la synchronisation, les étapes qui modifient le serveur sont
      # sautées. C'est ce qui permet de voir ce qu'un déploiement effacerait
      # AVANT de lui faire confiance, et de valider l'accès sans risque.
      dry_run:
        description: "Ne rien écrire : lister et simuler le transfert"
        required: false
        default: false
        type: boolean

# Une nouvelle poussée sur une proposition de fusion annule l'exécution en cours
# pour cette même référence : seul le dernier état compte. Les exécutions sur
# `main` ne sont jamais annulées — chacune correspond à un commit distinct de
# l'historique, et en perdre une laisserait un trou.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Aucune tâche de vérification ne lit de secret, et c'est délibéré : elles
# restent ainsi exécutables telles quelles sur une proposition venue d'un fork.
# La tâche `deploy`, elle, en lit — mais elle ne s'exécute jamais sur une
# `pull_request`, donc la propriété est préservée telle qu'elle est spécifiée.
permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 22 : la seule version qui satisfasse à la fois le `engines` du
      # frontend et la production, qui tourne sur le node 22 du nodevenv
      # o2switch. Vérifier sur une version que le serveur n'exécute pas
      # reviendrait à vérifier autre chose que ce qui est déployé.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` et non `npm install` : il échoue si le verrou et le manifeste
      # divergent, ce qui est précisément le signal recherché.
      #
      # Le `postinstall` du paquet déclenche `prisma generate`. Vérifié : il
      # fonctionne sans `DATABASE_URL`, donc aucune variable n'est nécessaire ici.
      - run: npm ci
        working-directory: backend

      - run: npm run format:check
        working-directory: backend

      # Aucune variable d'environnement, aucun service. Vérifié avant d'écrire
      # ce fichier : la suite passe 539/539 dans un environnement entièrement
      # vierge et sans base joignable.
      - run: npm test
        working-directory: backend

      - run: npm run build
        working-directory: backend

      # Non bloquant. Le dépôt compte 659 problèmes eslint côté backend, dont
      # environ 294 ne sont pas auto-corrigeables : les rendre bloquants
      # reviendrait à exiger une remise à plat de cette taille avant toute
      # fusion. Le rapport reste lisible dans les journaux, et son nettoyage
      # est une entrée distincte de TODOS.md.
      - name: eslint (rapport, non bloquant)
        run: npm run lint:check
        working-directory: backend
        continue-on-error: true

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run format:check
        working-directory: frontend

      # `build` enchaîne `vue-tsc --build` et `vite build` par `run-p`, donc le
      # contrôle de typage est couvert sans étape séparée.
      - run: npm run build
        working-directory: frontend

      - name: eslint et oxlint (rapport, non bloquant)
        run: npm run lint:check
        working-directory: frontend
        continue-on-error: true

  e2e:
    name: e2e
    runs-on: ubuntu-latest

    # `mail-boot.e2e-spec.ts` épingle une garantie qu'aucun test unitaire ne
    # couvre : aucun défaut de configuration SMTP n'empêche l'API de démarrer.
    # Elle exige un PostgreSQL joignable, parce que `PrismaService.onModuleInit`
    # appelle `$connect()`.
    #
    # Un service déclaré ici, créé et détruit avec la tâche, n'est pas une
    # dépendance extérieure : il ne tient à aucun secret ni à aucune machine
    # tierce, et il est reproductible d'une exécution à l'autre.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tambouille
          POSTGRES_PASSWORD: tambouille
          POSTGRES_DB: tambouille
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tambouille"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      # AUCUNE étape de migration, et ce n'est pas un oubli : vérifié contre une
      # base vide et non migrée, la suite passe. `onModuleInit` se contente d'un
      # `$connect()`, sans requête. Ajouter `prisma migrate deploy` ici ferait
      # dépendre la vérification d'un état de schéma dont elle n'a pas besoin.
      - run: npm run test:e2e
        working-directory: backend
        env:
          DATABASE_URL: postgresql://tambouille:tambouille@localhost:5432/tambouille?schema=public

  # ─────────────────────────────────────────────────────────────────────────
  # Déploiement vers o2switch.
  #
  # `needs` sur les trois vérifications : déployer sans qu'elles soient vertes
  # est impossible, et c'est une propriété du graphe des tâches, pas une
  # consigne qu'on rappelle. La condition `workflow_dispatch` garantit qu'aucune
  # `pull_request` ne peut atteindre cette tâche, donc les secrets ci-dessous ne
  # sont jamais exposés à du code venu d'un fork.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: deploy
    needs: [backend, frontend, e2e]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Un déploiement qui pend est pire qu'un déploiement qui échoue : il ne dit
    # rien et consomme. Le 17 août, un rclone bloqué sur une invite
    # d'authentification a tourné jusqu'à l'annulation manuelle.
    timeout-minutes: 20
    # Deux déploiements ne se chevauchent jamais, et aucun n'est annulé en
    # cours de route : interrompre un transfert laisserait le serveur mi-ancien
    # mi-neuf, ce qu'aucune étape ultérieure ne rattraperait.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      REMOTE: /home/${{ secrets.O2SWITCH_USER }}/tambouille
      RCLONE_CONFIG_O2_TYPE: sftp
      RCLONE_CONFIG_O2_HOST: ${{ secrets.O2SWITCH_HOST }}
      RCLONE_CONFIG_O2_USER: ${{ secrets.O2SWITCH_USER }}
      RCLONE_CONFIG_O2_KEY_FILE: /home/runner/.ssh/deploy_key
      # Ne jamais demander de mot de passe : sans cela rclone attend une saisie
      # sur un runner qui n'en fournira jamais.
      RCLONE_CONFIG_O2_ASK_PASSWORD: "false"
      # Bornes de temps : un transfert qui n'aboutit pas doit échouer, pas pendre.
      RCLONE_CONTIMEOUT: 15s
      RCLONE_TIMEOUT: 60s
      RCLONE_LOW_LEVEL_RETRIES: "2"

    steps:
      - uses: actions/checkout@v7
        with:
          # Vide sur un déclenchement ordinaire : actions/checkout retombe alors
          # sur la référence courante.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Configuration par variables d'environnement plutôt que par fichier
      # encodé dans un secret : la clé SSH reste le seul élément sensible,
      # celui dont on a besoin de toute façon pour les migrations.
      - name: Clé SSH et hôte connu
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.O2SWITCH_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.O2SWITCH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # apt-get plutôt qu'une action tierce : ce workflow porte la clé SSH de
      # production, et une action tierce épinglée sur un tag mobile pourrait la
      # lire. Voir design.md, Decisions.
      # SONDE TEMPOIRE — à retirer une fois le transport choisi.
      #
      # Le port 22 s'est révélé filtré depuis un runner (connexion abandonnée
      # sans réponse) alors qu'il répond depuis un poste de développement : le
      # pare-feu du mutualisé n'accepte que des adresses connues. Avant de
      # réécrire le transfert en FTP, il faut savoir si le 21 subit le même
      # sort — sinon on aurait bâti toute une voie sur une hypothèse invérifiée,
      # ce qui est exactement l'erreur qu'on vient de faire.
      #
      # Aucune de ces sondes n'a besoin d'identifiants : elles n'ouvrent qu'une
      # connexion TCP. `timeout` distingue les deux réponses qui comptent —
      # « refusé » (port fermé, la machine répond) contre « expiré » (paquets
      # jetés, pare-feu).
      - name: Sonder les ports depuis le runner
        run: |
          set -uo pipefail
          probe() {
            local port=$1 label=$2
            if timeout 8 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.O2SWITCH_HOST }}/$port" 2>/dev/null; then
              echo "  port $port ($label) : OUVERT"
            else
              case $? in
                124) echo "  port $port ($label) : EXPIRÉ — paquets jetés, pare-feu" ;;
                *)   echo "  port $port ($label) : refusé ou fermé" ;;
              esac
            fi
          }
          probe 21  "FTP"
          probe 22  "SSH"
          probe 990 "FTPS implicite"
          probe 443 "HTTPS — témoin, doit être ouvert"

      - name: Installer rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Construire le backend
        working-directory: backend
        run: npm ci && npm run build

      - name: Construire le frontend
        working-directory: frontend
        run: npm ci && npm run build

      # ── Transfert ────────────────────────────────────────────────────────
      #
      # `sync` (miroir, supprime les fichiers surnuméraires) par SOUS-RÉPERTOIRE,
      # jamais sur `backend/` lui-même. `.env`, `node_modules/`, `tmp/`,
      # `.htaccess` et les 222 Mo d'`uploads/` vivent à la racine de `backend/` :
      # ils sont hors de portée par construction.
      #
      # `--max-delete` est la seconde protection, indépendante de la première :
      # elle tient même si quelqu'un réécrit un chemin de travers. Un échec sur
      # cette garde se LIT, il ne se relève pas par réflexe.
      - name: Transférer les artefacts
        run: |
          set -euo pipefail
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
            echo "── MODE SIMULATION : rien ne sera écrit ──"
            echo "Contenu actuel de la destination :"
            rclone lsd o2:$REMOTE
            rclone lsd o2:$REMOTE/backend
          fi
          rclone sync backend/dist/      o2:$REMOTE/backend/dist/      --max-delete=50 $DRY --stats-one-line
          rclone sync backend/generated/ o2:$REMOTE/backend/generated/ --max-delete=50 $DRY --stats-one-line
          rclone sync backend/prisma/    o2:$REMOTE/backend/prisma/    --max-delete=20 $DRY --stats-one-line
          rclone sync frontend/dist/     o2:$REMOTE/frontend/dist/     --max-delete=80 $DRY --stats-one-line
          rclone copy backend/package.json      o2:$REMOTE/backend/ $DRY
          rclone copy backend/package-lock.json o2:$REMOTE/backend/ $DRY

      # ── Dépendances d'exécution ──────────────────────────────────────────
      #
      # `npm install --omit=dev`, JAMAIS `npm ci`.
      #
      # `npm ci` commence par supprimer `node_modules`. Or CloudLinux NodeJS
      # Selector exige que ce répertoire soit un LIEN SYMBOLIQUE vers le
      # virtualenv de l'application. Un `npm ci` détruit le lien, vide sa cible,
      # et toute commande npm ultérieure est refusée — c'est exactement ce qui a
      # cassé la production le 17 août 2026, et il a fallu rétablir le lien à la
      # main. Ne « simplifiez » pas cette ligne.
      #
      # L'installation n'a lieu que si le verrou a changé : sur un mutualisé,
      # c'est une à deux minutes économisées sur la grande majorité des
      # livraisons.
      - name: Installer les dépendances d'exécution si le verrou a changé
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          LOCAL=$(sha256sum backend/package-lock.json | cut -d' ' -f1)
          REMOTE_SUM=$(ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/deploy_key ${{ secrets.O2SWITCH_USER }}@${{ secrets.O2SWITCH_HOST }} \
            "sha256sum $REMOTE/backend/package-lock.json.deployed 2>/dev/null | cut -d' ' -f1" || true)
          if [ "$LOCAL" = "$REMOTE_SUM" ]; then
            echo "Verrou inchangé — pas d'installation."
            exit 0
          fi
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/deploy_key ${{ secrets.O2SWITCH_USER }}@${{ secrets.O2SWITCH_HOST }} bash -euo pipefail <<EOSSH
            source ~/nodevenv/tambouille/backend/22/bin/activate
            cd $REMOTE/backend
            npm install --omit=dev
            # La structure imposée par l'hébergeur doit avoir survécu.
            if [ ! -L node_modules ]; then
              echo "ERREUR : node_modules n'est plus un lien symbolique." >&2
              exit 1
            fi
            cp package-lock.json package-lock.json.deployed
          EOSSH

      # ── Schéma, puis redémarrage ─────────────────────────────────────────
      #
      # Migrer AVANT de redémarrer : pendant la fenêtre qui suit, l'ancien code
      # tourne sur le nouveau schéma, ce qui est sûr tant que les migrations
      # sont additives. L'inverse ne l'est jamais.
      - name: Migrer et redémarrer
        if: ${{ !inputs.dry_run }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/deploy_key ${{ secrets.O2SWITCH_USER }}@${{ secrets.O2SWITCH_HOST }} bash -euo pipefail <<EOSSH
            source ~/nodevenv/tambouille/backend/22/bin/activate
            # Le PATH du serveur porte un node 24.11.x qui ne satisfait pas le
            # \`engines\` du projet et n'est pas celui que Passenger exécute.
            node -v | grep -q '^v22\.' || { echo "ERREUR : node \$(node -v) au lieu de 22.x" >&2; exit 1; }
            cd $REMOTE/backend
            npx --yes prisma@7 migrate deploy
            touch tmp/restart.txt
          EOSSH

      # Constater plutôt que supposer : un redémarrage réussi n'exclut pas que
      # les deux moitiés du site soient désaccordées. C'est arrivé le 17 août.
      - name: Vérifier que le site répond
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS -o /dev/null -w 'API  %{http_code}\n' https://api.tambouille.pantagruweb.club/api/mixes
          curl -fsS -o /dev/null -w 'site %{http_code}\n' https://tambouille.pantagruweb.club/
