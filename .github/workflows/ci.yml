name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Le déploiement partait d'abord sur commande seule, le temps qu'on lui fasse
  # confiance. Il part maintenant aussi de lui-même sur `main` — c'est le point
  # du chantier : la production a servi neuf jours de code périmé parce que
  # déployer était un geste qu'on pouvait simplement ne pas faire.
  #
  # `workflow_dispatch` reste, et n'est pas un vestige : `ref` est le retour
  # arrière. Redéployer une version connue-bonne en la désignant, sans révoquer
  # de commit ni réécrire l'historique.
  workflow_dispatch:
    inputs:
      ref:
        description: "Référence à déployer (défaut : la branche courante)"
        required: false
        type: string

# Une nouvelle poussée sur une proposition de fusion annule l'exécution en cours
# pour cette même référence : seul le dernier état compte. Les exécutions sur
# `main` ne sont jamais annulées — chacune correspond à un commit distinct de
# l'historique, et en perdre une laisserait un trou.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Aucune tâche de vérification ne lit de secret, et c'est délibéré : elles
# restent ainsi exécutables telles quelles sur une proposition venue d'un fork.
# La tâche `deploy`, elle, en lit — mais elle ne s'exécute jamais sur une
# `pull_request`, donc la propriété est préservée telle qu'elle est spécifiée.
permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # La référence choisie au déclenchement manuel, comme la tâche `deploy` :
        # sans elle, un `ref` partirait en production sur la foi des tests d'un
        # autre arbre. Vide hors `workflow_dispatch`, donc sans effet ailleurs.
        with:
          ref: ${{ inputs.ref }}

      # Node 22 : la seule version qui satisfasse à la fois le `engines` du
      # frontend et la production, qui tourne sur le node 22 de Plesk
      # (`/opt/plesk/node/22`). Vérifier sur une version que le serveur n'exécute pas
      # reviendrait à vérifier autre chose que ce qui est déployé.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` et non `npm install` : il échoue si le verrou et le manifeste
      # divergent, ce qui est précisément le signal recherché.
      #
      # Le client Prisma n'est plus généré à l'installation mais par les hooks
      # `prebuild` / `pretest` du paquet. `npm install` s'exécute dans le
      # virtualenv CloudLinux du serveur, où `prisma/schema.prisma` n'existe pas,
      # et le `postinstall` y faisait échouer l'installation entière.
      - run: npm ci
        working-directory: backend

      - run: npm run format:check
        working-directory: backend

      # Aucune variable d'environnement, aucun service. Vérifié : la suite passe
      # intégralement dans un environnement entièrement vierge et sans base
      # joignable. (Le nombre de tests n'est pas cité ici : il change, et un
      # commentaire qui vieillit mal vaut moins que pas de commentaire.)
      - run: npm test
        working-directory: backend

      - run: npm run build
        working-directory: backend

      # Hors ligne : une fausse arborescence, des doublures de `npx` et `npm`.
      # C'est ce qui garde l'ordre migrations → code, et les répertoires
      # jamais touchés, sans attendre un déploiement réel pour le découvrir.
      - name: Tester le script de déploiement
        run: bash deploy/plesk-deploy.test.sh

      # Non bloquant. Le dépôt compte 659 problèmes eslint côté backend, dont
      # environ 294 ne sont pas auto-corrigeables : les rendre bloquants
      # reviendrait à exiger une remise à plat de cette taille avant toute
      # fusion. Le rapport reste lisible dans les journaux, et son nettoyage
      # est une entrée distincte de TODOS.md.
      - name: eslint (rapport, non bloquant)
        run: npm run lint:check
        working-directory: backend
        continue-on-error: true

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run format:check
        working-directory: frontend

      - run: npm test
        working-directory: frontend

      # `build` enchaîne `vue-tsc --build` et `vite build` par `run-p`, donc le
      # contrôle de typage est couvert sans étape séparée.
      - run: npm run build
        working-directory: frontend

      - name: eslint et oxlint (rapport, non bloquant)
        run: npm run lint:check
        working-directory: frontend
        continue-on-error: true

  e2e:
    name: e2e
    runs-on: ubuntu-latest

    # `mail-boot.e2e-spec.ts` épingle une garantie qu'aucun test unitaire ne
    # couvre : aucun défaut de configuration SMTP n'empêche l'API de démarrer.
    # Elle exige un PostgreSQL joignable, parce que `PrismaService.onModuleInit`
    # appelle `$connect()`.
    #
    # Un service déclaré ici, créé et détruit avec la tâche, n'est pas une
    # dépendance extérieure : il ne tient à aucun secret ni à aucune machine
    # tierce, et il est reproductible d'une exécution à l'autre.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tambouille
          POSTGRES_PASSWORD: tambouille
          POSTGRES_DB: tambouille
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tambouille"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      # AUCUNE étape de migration, et ce n'est pas un oubli : vérifié contre une
      # base vide et non migrée, la suite passe. `onModuleInit` se contente d'un
      # `$connect()`, sans requête. Ajouter `prisma migrate deploy` ici ferait
      # dépendre la vérification d'un état de schéma dont elle n'a pas besoin.
      - run: npm run test:e2e
        working-directory: backend
        env:
          DATABASE_URL: postgresql://tambouille:tambouille@localhost:5432/tambouille?schema=public

  # ─────────────────────────────────────────────────────────────────────────
  # Déploiement vers le serveur Plesk, par SSH.
  #
  # `needs` sur les trois vérifications : déployer sans qu'elles soient vertes
  # est impossible, et c'est une propriété du graphe des tâches. La condition
  # ci-dessous nomme ses deux événements plutôt que d'écarter le troisième, et ce
  # n'est pas du style : elle est ce qui garantit qu'aucune `pull_request`
  # n'atteint cette tâche, donc que les secrets ne sont jamais exposés à du code
  # venu d'un fork. Écrite en négatif — « sauf pull_request » — un quatrième
  # déclencheur ajouté plus tard y tomberait sans qu'on l'ait voulu. Et le test
  # sur `github.ref` n'est pas décoratif : sans lui, une poussée sur n'importe
  # quelle branche déploierait en production.
  #
  # Chez o2switch, SSH était filtré depuis les runners et le déploiement passait
  # par l'API cPanel. Le serveur Plesk accepte SSH : la CI y envoie une archive
  # et lit le code de sortie du script, donc elle sait si le déploiement a
  # réussi. Voir backend/README.md, « Déploiement ».
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: deploy
    needs: [backend, frontend, e2e]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Deux déploiements ne se chevauchent jamais, et aucun n'est annulé en cours
    # de route : interrompre celui-ci laisserait le serveur mi-ancien mi-neuf.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Construire le backend
        working-directory: backend
        run: npm ci && npm run build

      - name: Construire le frontend
        working-directory: frontend
        run: npm ci && npm run build

      # ── Envoi ────────────────────────────────────────────────────────────
      #
      # Le serveur est un Plesk mutualisé : on s'y connecte en `nellybabtb`,
      # qui a les droits sur le dossier de Tambouille. La clé est BRIDÉE par
      # une commande forcée (`restrict,command=…` dans authorized_keys) : elle
      # ne peut que lancer deploy/plesk-entry.sh, qui déballe l'archive lue sur
      # l'entrée standard et exécute le plesk-deploy.sh qu'elle contient. La
      # commande demandée par ssh ci-dessous est donc ignorée — il n'y en a pas.
      #
      # `StrictHostKeyChecking=yes` avec l'empreinte fournie par un secret :
      # accepter l'hôte à la volée enverrait la production à quiconque se
      # place entre GitHub et le serveur.
      - name: Préparer la clé SSH
        env:
          SSH_KEY: ${{ secrets.PLESK_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PLESK_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Le code de sortie du script distant devient celui de l'étape : une
      # migration en échec, une archive incomplète font échouer la CI.
      - name: Envoyer et déployer
        env:
          SSH_HOST: ${{ secrets.PLESK_SSH_HOST }}
        run: |
          set -euo pipefail
          tar czf - \
            backend/dist backend/generated backend/prisma \
            backend/package.json backend/package-lock.json \
            frontend/dist frontend/src/content/fournees \
            deploy/plesk-deploy.sh deploy/prisma.deploy.config.mjs |
            ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "nellybabtb@$SSH_HOST"

      - name: Vérifier que le site répond
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS -o /dev/null -w 'API  %{http_code}\n' https://api.tambouille.pantagruweb.club/api/mixes
          curl -fsS -o /dev/null -w 'site %{http_code}\n' https://tambouille.pantagruweb.club/
