services:
  postgres:
    image: postgres:16-alpine
    container_name: tambouille-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tambouille
      POSTGRES_PASSWORD: tambouille
      POSTGRES_DB: tambouille
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
